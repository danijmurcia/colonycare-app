version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: colonycare-app
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
    volumes:
      - ./src:/app/src
      - ./App.tsx:/app/App.tsx
      - node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
    stdin_open: true
    tty: true

volumes:
  node_modules: