version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: colonycare-app
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
    volumes:
      - ./src:/app/src
      - ./App.tsx:/app/App.tsx
      - ./index.ts:/app/index.ts
      - ./babel.config.js:/app/babel.config.js
      - ./metro.config.js:/app/metro.config.js
      - ./tailwind.config.js:/app/tailwind.config.js
      - ./tsconfig.json:/app/tsconfig.json
      - node_modules:/app/node_modules
    env_file:
      - .env
    stdin_open: true
    tty: true

volumes:
  node_modules: